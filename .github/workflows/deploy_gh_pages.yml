name: Build and Deploy Programming Guides

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for docs (default: latest for main, pr-preview-N for PR)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Install mdbook plugins
        run: |
          set -euo pipefail
          # mdbook-mermaid is a preprocessor: it must stay on PATH so that
          # build_docs.py can run "mdbook-mermaid install" before "mdbook build".
          cargo install mdbook-mermaid --locked

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-docs.txt

      - name: Install doxygen and esp-doxybook
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y doxygen
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tools/requirements-docs.txt

      - name: Build docs
        env:
          DOCS_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          version="${DOCS_VERSION:-}"
          if [[ -z "$version" ]]; then
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              version="pr-preview-${PR_NUMBER}"
            else
              version="latest"
            fi
          fi
          # The default is to build every component and report all failures at the end.
          python3 ./tools/build_docs.py --version "$version" --output-dir docs_build_output

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --root-dir docs_build_output
            --exclude-path '.*/404\.html$'
            docs_build_output/**/*.html
          # Fail the action if broken links are found
          fail: true

      # Create directory structure for GitHub Pages with "version prefix"
      - name: Prepare pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'espressif'
        run: |
          set -euo pipefail
          version="latest"
          mkdir -p "gh-pages/$version"
          cp -r docs_build_output/* "gh-pages/$version/"

      - name: Upload pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'espressif'
        uses: actions/upload-pages-artifact@v4
        with:
          path: gh-pages

      - name: Upload docs artifact for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: docs-preview-pr-${{ github.event.pull_request.number }}
          path: docs_build_output
          retention-days: 7
          if-no-files-found: error

      - name: Generate build summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          # For pull requests, ref_name is refs/pull/<number>/merge; head_ref is the source branch.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          python3 tools/ci/write_summary.py \
            --output "$GITHUB_STEP_SUMMARY" \
            --title "Docs Build Summary" \
            --row "Status" "$STATUS" \
            --row "Event" "$EVENT_NAME" \
            --row "Branch" "$BRANCH" \
            --row "Commit" "$COMMIT" \
            --row "By" "$ACTOR"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'espressif'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}latest/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Generate deploy summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 tools/ci/write_summary.py \
            --output "$GITHUB_STEP_SUMMARY" \
            --title "Docs Deploy Summary" \
            --row "Status" "$STATUS" \
            --row "Environment" "github-pages" \
            --row "URL" "${PAGE_URL}latest/"
