name: Build Apps

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_IDF_VERSIONS_JSON: '["release-v5.5","latest"]'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  discover-apps:
    name: Discover Buildable Apps
    runs-on: ubuntu-latest
    container: espressif/idf:latest
    timeout-minutes: 20
    outputs:
      app_paths_json: ${{ steps.discover.outputs.app_paths_json }}
      app_paths_text: ${{ steps.discover.outputs.app_paths_text }}
      app_count: ${{ steps.discover.outputs.app_count }}
      idf_versions: ${{ steps.set-matrix.outputs.idf_versions }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: 'recursive'

      - name: Set matrix versions
        id: set-matrix
        env:
          IDF_VERSIONS: ${{ env.DEFAULT_IDF_VERSIONS_JSON }}
        run: |
          set -euo pipefail
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "idf_versions<<$delimiter"
            printf '%s\n' "$IDF_VERSIONS"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Install idf-ci
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          python3 -m pip install --quiet idf-ci
          python3 -c "import importlib.metadata; print(f\"idf-ci {importlib.metadata.version('idf-ci')}, esptool {importlib.metadata.version('esptool')}\")"

      - name: Discover apps
        id: discover
        env:
          COLLECT_OUTPUT_FILE: ${{ runner.temp }}/idf-ci-build-collect.json
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          idf-ci build collect --paths . --format json --output "$COLLECT_OUTPUT_FILE"
          app_paths_json=$(python3 tools/ci/discover_buildable_apps.py "$COLLECT_OUTPUT_FILE")
          app_count=$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$app_paths_json")
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "app_count=${app_count}"
            echo "app_paths_json=${app_paths_json}"
            echo "app_paths_text<<$delimiter"
            python3 -c 'import json,sys; print("\n".join(json.loads(sys.argv[1])))' "$app_paths_json"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Generate discovery summary
        if: always()
        env:
          APP_COUNT: ${{ steps.discover.outputs.app_count }}
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          APP_PATHS: ${{ steps.discover.outputs.app_paths_text }}
        run: |
          set -euo pipefail

          summary_args=(
            --output "$GITHUB_STEP_SUMMARY"
            --title "App Discovery Summary"
            --row "Apps Discovered" "$APP_COUNT"
            --row "Status" "$JOB_STATUS"
            --row "Event" "$EVENT_NAME"
            --row "Branch" "$BRANCH"
            --row "Commit" "$COMMIT"
          )
          if [[ "$APP_COUNT" != "0" ]]; then
            summary_args+=(
              --code-block-title "Apps to Build"
              --code-block-content "$APP_PATHS"
            )
          fi
          python3 tools/ci/write_summary.py "${summary_args[@]}"

  build:
    needs: discover-apps
    if: needs.discover-apps.result == 'success' && needs.discover-apps.outputs.app_count != '0'
    name: Build (ESP-IDF ${{ matrix.idf_ver }})
    strategy:
      fail-fast: false
      matrix:
        idf_ver: ${{ fromJson(needs.discover-apps.outputs.idf_versions) }}
    runs-on: ubuntu-latest
    container: espressif/idf:${{ matrix.idf_ver }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Install idf-ci
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          python3 -m pip install --quiet idf-ci
          python3 -c "import importlib.metadata; print(f\"idf-ci {importlib.metadata.version('idf-ci')}, esptool {importlib.metadata.version('esptool')}\")"

      - name: Build apps
        env:
          IDF_VERSION: ${{ matrix.idf_ver }}
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          echo "Building all discovered apps from repository root with ESP-IDF $IDF_VERSION..."
          idf-ci build run --target all

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-${{ matrix.idf_ver }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            **/build_esp*/**/*.bin
            **/build_esp*/**/*.elf
            **/build_esp*/**/sdkconfig
            **/build_esp*/**/sdkconfig.json
            **/build_esp*/**/flasher_args.json
            **/build_esp*/**/project_description.json
            app_info_*.txt
          retention-days: 7
          compression-level: 6
          overwrite: true

      - name: Generate build step summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          APP_COUNT: ${{ needs.discover-apps.outputs.app_count }}
          IDF_VERSION: ${{ matrix.idf_ver }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          ICON="❓"
          if [[ "$STATUS" == "success" ]]; then
            ICON="✅"
          elif [[ "$STATUS" == "failure" ]]; then
            ICON="❌"
          elif [[ "$STATUS" == "cancelled" ]]; then
            ICON="⛔"
          fi

          python3 tools/ci/write_summary.py \
            --output "$GITHUB_STEP_SUMMARY" \
            --title "Build Summary $ICON (ESP-IDF $IDF_VERSION)" \
            --row "Apps" "$APP_COUNT" \
            --row "ESP-IDF" "$IDF_VERSION" \
            --row "Trigger" "$EVENT_NAME" \
            --row "Branch" "$BRANCH" \
            --row "Commit" "$COMMIT" \
            --row "Status" "$STATUS"
